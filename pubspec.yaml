name: maestri_wire_client
description: "Cliente Maestri Wire multiplataforma (Android & Windows) com design idêntico ao macOS."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  web_socket_channel: ^2.4.5
  http: ^1.2.1
  flutter_secure_storage: ^9.2.1
  mobile_scanner: ^5.1.1
  google_fonts: ^6.2.1
  intl: ^0.19.0
  uuid: ^4.4.0
  crypto: ^3.0.3
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
